<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>Sin conexión · Vitta</title>
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#f7f2f4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1a1b1f" media="(prefers-color-scheme: dark)" />
		<style>
			:root {
				--background: #f7f2f4;
				--card: #ffffff;
				--foreground: #1f1d24;
				--muted: #6b6573;
				--primary: #14509f;
				--primary-foreground: #ffffff;
				--border: #e6dbe0;
				color-scheme: light dark;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--background: #1a1b1f;
					--card: #25252b;
					--foreground: #f2f1f4;
					--muted: #a3a1aa;
					--primary: #2578e4;
					--border: #33333a;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px 16px;
				background: var(--background);
				color: var(--foreground);
				font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI",
					Roboto, sans-serif;
				line-height: 1.5;
			}
			main {
				width: 100%;
				max-width: 380px;
				padding: 32px 24px;
				border: 1px solid var(--border);
				border-radius: 24px;
				background: var(--card);
				text-align: center;
			}
			img {
				width: 64px;
				height: 64px;
				image-rendering: pixelated;
			}
			h1 {
				margin: 16px 0 8px;
				font-size: 1.375rem;
				line-height: 1.25;
			}
			p {
				margin: 0;
				color: var(--muted);
				text-wrap: pretty;
			}
			button {
				margin-top: 24px;
				width: 100%;
				height: 44px;
				border: 0;
				border-radius: 12px;
				background: var(--primary);
				color: var(--primary-foreground);
				font: inherit;
				font-weight: 700;
				cursor: pointer;
				transition: transform 150ms cubic-bezier(0.32, 0.72, 0, 1);
			}
			button:active {
				transform: scale(0.98);
			}
			button:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: 3px;
			}
			@media (prefers-reduced-motion: reduce) {
				button {
					transition: none;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/pwa-192x192.png" alt="" />
			<h1>Estás sin conexión</h1>
			<p>
				Vitta necesita internet para guardar y mostrar tus registros. Tus datos
				están a salvo: vuelve a intentarlo cuando tengas conexión.
			</p>
			<button type="button" onclick="location.reload()">Reintentar</button>
		</main>
		<script>
			// Recarga sola en cuanto vuelve la conexión.
			window.addEventListener("online", () => location.reload());
		</script>
	</body>
</html>
